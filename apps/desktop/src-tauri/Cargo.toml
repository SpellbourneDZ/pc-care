[package]
name = "pc-care"
version = "0.1.0"
description = "Local Windows maintenance utility"
publish = false
edition = "2024"
rust-version = "1.99"

[features]
qa-fixtures = []

[lib]
name = "pc_care"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = [] }
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["ApplicationModel", "Management_Deployment", "Storage_Search", "Win32_System_WinRT"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Ioctl"] }
