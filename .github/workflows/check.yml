name: Windows checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm types:check
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:uninstall-fixture
      - run: pnpm build:web
      - run: pnpm test:smoke
      - run: pnpm rust:check
      - run: pnpm build:installer
      - run: pnpm test:native
      - run: pnpm build:qa
      - run: pnpm test:settings
      - run: pnpm test:installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc-care-draft-nsis-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*_x64-setup.exe
            target/release/bundle/nsis/draft-manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc-care-read-only-preview-${{ github.sha }}
          path: |
            target/release/pc-care.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pc-care-test-evidence-${{ github.sha }}
          path: |
            apps/desktop/test-results/**/*.png
            apps/desktop/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
